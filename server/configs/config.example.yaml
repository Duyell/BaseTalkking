server:
  port: 8080
  mode: debug

database:
  mysql:
    host: 127.0.0.1
    port: 3306
    user: root
    password: ""
    dbname: basetalkking
    charset: utf8mb4
    max_open_conns: 100
    max_idle_conns: 10
    conn_max_lifetime: 3600

